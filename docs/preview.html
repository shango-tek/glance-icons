<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glance Icons Preview</title>
<style>
  :root { --page: #f4f5f7; --text: #1f2328; --muted: #6c707e; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--page); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; gap: 12px; }
  h2 { font-size: 15px; margin: 32px 0 12px; }
  p.lead { color: var(--muted); margin: 0 0 8px; }
  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .panel { border-radius: 10px; padding: 12px 8px; overflow: hidden; }
  .light { background: #ffffff; color: #1f2328; border: 1px solid #dfe1e5; }
  .dark  { background: #1e1f22; color: #dfe1e5; border: 1px solid #393b40; }
  .panel h3 { margin: 0 8px 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  .tree { font: 13px/22px "JetBrains Mono", ui-monospace, Menlo, monospace; }
  .row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .row img, .row svg { width: 16px; height: 16px; flex: none; }
  .note { opacity: .45; font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 4px; }
  .cell { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
  .cell img.big { width: 32px; height: 32px; }
  .cell img.small { width: 16px; height: 16px; }
</style>
</head>
<body>
<h1><img src="../src/main/resources/META-INF/pluginIcon.svg" width="40" height="40" alt="">Glance Icons</h1>
<p class="lead">Icons at the real 16&nbsp;px size, in the IntelliJ light and dark themes. Open this file straight from the repository.</p>

<h2>In a project tree</h2>
<div class="themes">
  <div class="panel light"><h3>Light</h3><div class="tree" data-tree></div></div>
  <div class="panel dark"><h3>Dark</h3><div class="tree" data-tree></div></div>
</div>

<h2>Glance's own icons</h2>
<div class="themes">
  <div class="panel light"><div class="grid" data-set="own"></div></div>
  <div class="panel dark"><div class="grid" data-set="own"></div></div>
</div>

<h2>A selection of the 1,700+ file and folder icons</h2>
<div class="themes">
  <div class="panel light"><div class="grid" data-set="atom"></div></div>
  <div class="panel dark"><div class="grid" data-set="atom"></div></div>
</div>

<script>
  const RES = '../src/main/resources/';
  const own = n => `icons/files/${n}`;
  const atom = n => `atom/files/${n}`;
  const dir = n => `atom/folders/${n}`;

  const SETS = {
    own: ['typescript', 'component', 'angular', 'service', 'directive', 'pipe', 'guard', 'interceptor', 'routes', 'module', 'store',
          'model', 'readme', 'java', 'java_test', 'kotlin', 'kotlin_test'].map(own).concat(['icons/folders/directives']),
    atom: ['html', 'css', 'js', 'tsconfig', 'testts', 'mock', 'storybook', 'docker', 'dockercompose', 'maven', 'gradle', 'gradlekts', 'kubernetes',
           'helmcharts', 'azure', 'azurepipelines', 'bicep', 'angular', 'react', 'nextjs', 'nodejs', 'npm', 'pnpm', 'tailwindcss',
           'eslint', 'prettier', 'vitest', 'markdown', 'license', 'claude', 'makefile', 'png', 'jpg', 'gif', 'webp',
           'svg', 'pdf', 'word', 'powerpoint', 'excel'].map(atom)
           .concat(['src', 'app', 'components', 'node', 'web', 'docs', 'tests', 'i18n', 'idea', 'kubernetes', 'azure-devops', 'docker'].map(dir)),
  };

  // [depth, name, icon, note] – icon is a resource path without .svg, or 'ide' for the IDE's own folder
  const TREE = [
    [0, 'my-shop', 'ide', 'content root keeps the IDE icon'],
    [1, '.idea', dir('idea')],
    [1, '.github', dir('github')],
    [2, 'workflows', dir('ci')],
    [3, 'release.yml', atom('githubActions')],
    [1, 'frontend', dir('client')],
    [2, 'App.tsx', atom('react')],
    [2, 'vite.config.ts', atom('vite')],
    [1, 'backend', dir('server')],
    [2, 'pom.xml', atom('maven')],
    [2, 'build.gradle.kts', atom('gradlekts')],
    [2, 'UserService.java', own('java')],
    [2, 'UserServiceTest.java', own('java_test')],
    [1, 'docs', dir('docs')],
    [2, 'ARCHITECTURE.md', atom('architecture')],
    [2, 'pitch.pptx', atom('powerpoint')],
    [1, 'infra', dir('serverless')],
    [2, 'k8s', dir('kubernetes')],
    [3, 'deployment.yaml', atom('kubernetesdepl')],
    [3, 'web.yaml', atom('kubernetes'), 'found by apiVersion + kind'],
    [2, 'azure-pipelines.yml', atom('azurepipelines')],
    [2, 'main.bicep', atom('bicep')],
    [1, 'node_modules', dir('node')],
    [1, 'public', dir('web')],
    [1, 'src', dir('src')],
    [2, 'app', dir('app')],
    [3, 'components', dir('components')],
    [4, 'user-card.ts', own('component'), '@Component'],
    [4, 'user-card.html', atom('html')],
    [4, 'user-card.css', atom('css')],
    [4, 'user-card.spec.ts', atom('testts')],
    [3, 'directives', 'icons/folders/directives'],
    [4, 'tooltip.ts', own('directive'), '@Directive'],
    [3, 'guards', dir('guard')],
    [4, 'admin-guard.ts', own('guard')],
    [3, 'services', dir('functions')],
    [4, 'cart.ts', own('service'), '@Service()'],
    [3, 'app.config.ts', own('typescript'), 'Angular code, not Expo'],
    [3, 'app.routes.ts', own('routes')],
    [3, 'app.ts', own('component'), 'root component, not Node.js'],
    [2, 'i18n', dir('i18n')],
    [3, 'fr.ts', atom('i18nlang')],
    [2, 'main.ts', own('typescript')],
    [1, '.gitignore', atom('gitignore')],
    [1, 'CLAUDE.md', atom('claude')],
    [1, 'Dockerfile', atom('docker')],
    [1, 'LICENSE', atom('license')],
    [1, 'Makefile', atom('makefile')],
    [1, 'package.json', atom('npm')],
    [1, 'README.md', own('readme')],
    [1, 'angular.json', own('angular')],
    [1, 'tsconfig.json', atom('tsconfig')],
  ];

  const IDE_FOLDER = '<svg viewBox="0 0 16 16"><path d="M2 4a1 1 0 0 1 1-1h3.3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z" fill="none" stroke="#6C707E"/></svg>';
  // Hand-tuned drawings for Retina screens, light and dark, which the browser picks like IntelliJ does.
  const RETINA = { 'icons/files/typescript': ['@2x', '@2x'], 'icons/files/component': ['@2x', '@2x_dark'] };
  // Dark panels try <name>_dark.svg first, like IntelliJ does, and fall back to the shared icon.
  const img = (path, dark, cls = '') => {
    const retina = RETINA[path] ? ` srcset="${RES}${path}${RETINA[path][dark ? 1 : 0]}.svg 2x"` : '';
    return dark
      ? `<img class="${cls}" src="${RES}${path}_dark.svg"${retina} onerror="this.onerror=null;this.src='${RES}${path}.svg'" alt="">`
      : `<img class="${cls}" src="${RES}${path}.svg"${retina} alt="">`;
  };

  document.querySelectorAll('[data-tree]').forEach(tree => {
    const dark = tree.closest('.dark') !== null;
    tree.innerHTML = TREE.map(([depth, name, icon, note]) => {
      const picture = icon === 'ide' ? IDE_FOLDER : img(icon, dark);
      return `<div class="row" style="padding-left:${8 + depth * 18}px">${picture}<span>${name}</span>${note ? `<span class="note">${note}</span>` : ''}</div>`;
    }).join('');
  });

  document.querySelectorAll('[data-set]').forEach(grid => {
    const dark = grid.closest('.dark') !== null;
    grid.innerHTML = SETS[grid.dataset.set].map(path =>
      `<div class="cell">${img(path, dark, 'big')}${img(path, dark, 'small')}<span>${path.split('/').pop()}</span></div>`
    ).join('');
  });
</script>
</body>
</html>
