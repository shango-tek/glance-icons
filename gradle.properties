group = io.github.shangotek.glanceicons
version = 1.0.0

# IDE to compile, test and run against. The plugin declares support from 2025.1 (build 251) in build.gradle.kts.
platformVersion = 2026.2.3

# The IDE ships its own Kotlin standard library, so the plugin must not bundle one -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
